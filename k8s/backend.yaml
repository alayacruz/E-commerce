apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: shophub-backend
          imagePullPolicy: Never # Forces K8s to use your local image, not the internet
          ports:
            - containerPort: 5000
          env:
        #using postgres-service instead of localhost
            - name: DATABASE_URL
              value: "postgresql://admin:password123@postgres-service:5432/ecommerce?schema=public"
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch-service:9200"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000